name: PR check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the site (strict)
        run: mkdocs build --strict

      # Only for pull requests into main. A pull request into an epic branch
      # describes endpoints that reach staging only after the backend epic is
      # merged and deployed, so it would always fail here.
      # The documents come from the tip of main, not from the merge commit: a
      # re-run after the sync workflow refreshed them then sees the new endpoints
      # (a re-run keeps the original merge commit).
      - name: Endpoints named in the guides exist in the OpenAPI documents
        if: github.event_name != 'pull_request' || github.base_ref == 'main'
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/openapi"
          for f in resource.json auth.json; do
            git show "origin/main:docs/openapi/$f" > "$RUNNER_TEMP/openapi/$f"
          done
          OPENAPI_DIR="$RUNNER_TEMP/openapi" python scripts/check-endpoints.py

      - name: English only (no Serbian letters outside the generated OpenAPI documents)
        run: |
          if grep -rnP '[čćžšđČĆŽŠĐ]' docs README.md mkdocs.yml --exclude-dir=openapi; then
            echo "::error::Serbian letters found. Everything in this repository is in English."
            exit 1
          fi
